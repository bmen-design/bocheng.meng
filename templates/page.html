<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="$document_base">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="$description">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <title>$title</title>
  <link rel="stylesheet" href="assets/css/style.css?v=layout-14">
  <link rel="stylesheet" href="assets/css/typography.css?v=5">
  <noscript><style>noscript { display: contents; } #site-menu, #loader, .grid-project-figure-controls { display: none; }</style></noscript>
  <script type="module" src="assets/js/site.js?v=10"></script>
</head>
<body data-template="$view">
  <div id="loader"></div>
  <div id="site" class="font-sans-small">
    <header id="site-header">
      <a id="site-header-logo" class="cta-inline cta-inline--expanded link-ajax link-ajax--home$home_active" href="./" aria-label="$name, home">
        <span class="cta-inline-icon">
          <svg aria-hidden="true" data-icon="logo" viewBox="0 0 128 10">
            <text x="0" y="9.5" textLength="128" lengthAdjust="spacingAndGlyphs">$wordmark</text>
          </svg>
        </span>
      </a>
      <p id="site-header-tagline">$tagline</p>
    </header>
    <ul id="site-menu">$menu</ul>
    <noscript>
      <nav id="simple-menu" aria-label="Portfolio navigation">
        <details><summary class="cta-pill cta-pill--blur">Work</summary><ul>$simple_work</ul></details>
        <details><summary class="cta-pill cta-pill--blur">About</summary><div>$simple_about</div></details>
      </nav>
    </noscript>
    <main id="site-main">$main</main>
    <footer id="site-footer">
      <ul id="site-footer-menu">$footer_links</ul>
      <div id="site-footer-colophon">
        <div id="site-footer-colophon-credits"><p>$name</p></div>
        <div id="site-footer-colophon-copyright"><p>$footer_note</p></div>
      </div>
    </footer>
  </div>
</body>
</html>
