name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 export.py --base-path "${BASE_PATH:-/}"
      - name: Check visual baseline in Chrome
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 -m venv "$RUNNER_TEMP/visual-check"
          "$RUNNER_TEMP/visual-check/bin/pip" install --quiet playwright==1.60.0
          preview="$RUNNER_TEMP/site-preview"
          mount="$preview/${BASE_PATH#/}"
          mkdir -p "$(dirname "${mount%/}")"
          ln -s "$PWD/dist" "${mount%/}"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$preview" > "$RUNNER_TEMP/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --show-error --fail --retry 5 --retry-connrefused "http://127.0.0.1:8765${BASE_PATH%/}/" --output /dev/null
          "$RUNNER_TEMP/visual-check/bin/python" checks/visual_baseline.py --base-url "http://127.0.0.1:8765${BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
